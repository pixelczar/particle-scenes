<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Particle Scenes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Manrope:wght@200..800&family=Space+Grotesk:wght@300..700&display=block" rel="stylesheet" />
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    canvas { display: block; cursor: pointer; }
    #hint { position: fixed; left: 16px; bottom: 14px; font: 11px/1.4 Inter, system-ui, sans-serif;
      color: #fff; opacity: .28; letter-spacing: .02em; pointer-events: none; user-select: none; }
    .embed #hint { display: none; }
  </style>
</head>
<body>
  <div id="hint">click / space → next · 1 2 3 → jump</div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
